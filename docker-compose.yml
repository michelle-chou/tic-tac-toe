version: '2'
services:
  web:
    build: .
    command: >
        bash -c "while true ;do wait ;done"
    volumes:
      - .:/app
      - pip_path:/pip
      - /app/frontend/node_modules
    ports:
      - "3000:3000" # frontend
      - "3001:3001" # backend
      - "8080:8080" # codeserver
    environment:
      - PASSWORD
      - PYTHONUSERBASE=/pip/vendor
volumes:
  pip_path:
